<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7268" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16211d" media="(prefers-color-scheme: dark)">
<meta name="description" content="Nährtakt – Nahrungsergänzung richtig getaktet: Tagesplan, Einnahme-Zeitpunkte und Sicherheits-Abstände.">
<title>Nährtakt</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/img/icon-180.png">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<style>
  /* kritisch: Lade-Overlay sofort korrekt */
  .app-loading{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--bg,#f4f7f6);gap:14px;text-align:center}
  .app-loading[hidden]{display:none!important}
  .app-shell[hidden]{display:none!important}
</style>
</head>
<body>

<!-- Ladebildschirm -->
<div class="app-loading" id="loading">
  <div>
    <div class="spinner"></div>
    <p class="muted" style="margin-top:12px">Nährtakt wird geladen …</p>
  </div>
</div>

<!-- App -->
<div class="app-shell" id="app" hidden>
  <header class="appbar">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="1" y="1" width="30" height="30" rx="8" fill="var(--primary)"/>
      <path d="M8 22V10m0 0l8 12m0-12v12m0-12l8 12V10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
    </svg>
    <span class="title grow">Nährtakt</span>
    <button class="btn-icon" id="btnTheme" title="Design wechseln" aria-label="Design wechseln">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main class="app-main">
    <div class="wrap" id="view"><!-- View wird gerendert --></div>
  </main>

  <nav class="tabbar" id="tabbar" role="tablist" aria-label="Bereiche">
    <button role="tab" data-tab="heute" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.4 2.4 4.6-5"/></svg>
      <span>Heute</span>
    </button>
    <button role="tab" data-tab="plan" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/><circle cx="12" cy="14.5" r="2.3"/></svg>
      <span>Plan</span>
    </button>
    <button role="tab" data-tab="mittel" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2 2 0 016 3.5h13v15H6a2 2 0 00-2 2z"/><path d="M4 18.5A2 2 0 016 20.5h13"/><path d="M8.5 8h7M8.5 11.5h5"/></svg>
      <span>Mittel</span>
    </button>
    <button role="tab" data-tab="statistik" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4"/><path d="M4 20h16"/><rect x="7" y="12" width="3" height="6" rx="1"/><rect x="12.5" y="8" width="3" height="10" rx="1"/><rect x="18" y="5" width="3" height="13" rx="1"/></svg>
      <span>Statistik</span>
    </button>
    <button role="tab" data-tab="mehr" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      <span>Mehr</span>
    </button>
  </nav>
</div>

<div class="toast-host" id="toasts" aria-live="polite"></div>

<script src="assets/config.js"></script>
<script src="assets/engine.js"></script>
<script src="assets/license.js"></script>
<script src="assets/install.js"></script>
<script src="assets/app.js" defer></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
  }
</script>
</body>
</html>
