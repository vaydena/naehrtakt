<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f7268">
<meta name="robots" content="noindex,nofollow">
<title>Nährtakt – wird überarbeitet</title>
<meta http-equiv="refresh" content="0; url=./">
<link rel="canonical" href="https://naehrtakt.vaydena.de/">
<style>
  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#f4f7f6;color:#16211d}
  a{color:#0f7268}
</style>
</head>
<body>
  <p>Nährtakt wird überarbeitet – <a href="./">zur Startseite</a>.</p>
<script>
  (function(){
    "use strict";
    try{
      if ("serviceWorker" in navigator){
        navigator.serviceWorker.getRegistrations()
          .then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }).catch(function(){});
      }
      if (window.caches && caches.keys){
        caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }).catch(function(){});
      }
    }catch(e){}
    try{ location.replace("./"); }catch(e){ location.href="./"; }
  })();
</script>
</body>
</html>
